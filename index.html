body {
    font-family: "Segoe UI", Arial, sans-serif;

    margin: 0;
    padding: 20px;
}

/* Title */
h3 {
    margin-top: 20px;
    font-size: 22px;
}

/* Table styling */
table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

th {
    background: #2c3e50;
    color: white;
    padding: 12px;
    font-size: 14px;
}

td {
    padding: 10px;
    text-align: center;
    border-bottom: 1px solid #eee;
}

/* Row hover */
tr:hover {
    background: #f1f7ff;
}

/* Input */
input[type="number"] {
    width: 70px;
    padding: 5px;
    border-radius: 5px;
    border: 1px solid #ccc;
    text-align: center;
}
/* 
input[type="button"] {
    
} */

/* Total column */
td[id^="t"] {
    font-weight: bold;
    color: #27ae60;
}

/* Grand total */
#grandTotal {
    color: #e74c3c;
    font-weight: bold;
    font-size: 24px;
}

/* Buttons */
button {
    margin-top: 15px;
    margin-right: 10px;
    padding: 10px 18px;
    font-size: 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.2s;
}

/* Different button styles */
button:nth-of-type(1) {
    background: #27ae60;
    color: white;
}

button:nth-of-type(2) {
    background: #e74c3c;
    color: white;
}

button:nth-of-type(3) {
    background: #3498db;
    color: white;
}

/* Hover effect */
button:hover {
    opacity: 0.85;
    transform: scale(1.03);
}
</style>
</head>

<script>
const table = document.getElementById("productTable");

products.forEach(p => {
    let row = `
        <tr>
            <td>${p.id}</td>
            <td>${p.name}</td>
            <td id="p${p.id}">${p.price}</td>   
            <td><input type="number" id="${p.id}" min="0"></td>
            <td id="t${p.id}">0</td>
        </tr>
    `;
    table.innerHTML += row;
});


function calculate() {
    let total = 0;

    products.forEach(p => {
        let qty = parseFloat(document.getElementById(p.id).value) || 0;
        let sum = qty * p.price;

        document.getElementById("t" + p.id).innerText = sum;
        total += sum;
    });

    document.getElementById("grandTotal").innerText = total;
}

document.addEventListener("input", calculate);

function checkout() {
    let items = [];

    products.forEach(p => {
        let qty = parseFloat(document.getElementById(p.id).value) || 0;

        if (qty > 0) {
            items.push({
                id: p.id,
                name: p.name,
                price: p.price,
                qty: qty
            });
        }
    });

    let record = {
        time: new Date().toLocaleString(),
        shop_id: "SHOP01",
        items: items
    };

    let history = JSON.parse(localStorage.getItem("salesCSV")) || [];

    let time = new Date().toLocaleString();

    products.forEach(p => {
        let qty = parseFloat(document.getElementById(p.id).value) || 0;

        if (qty > 0) {
            history.push([
                time,
                p.id,
                p.name,
                p.price,
                qty,
                p.price * qty
            ]);
        }
    });

    localStorage.setItem("salesCSV", JSON.stringify(history));

    fetch("https://script.google.com/macros/s/AKfycbxCwrJ3bx0PZlAECdAZfi1Rw_fyv6hyAH8I-5YNsCsc_5cbfwdHo9mooZIvud_lE40/exec", {
    method: "POST",
    mode: "no-cors",   // 🔥 important
    body: JSON.stringify(record)
    });

    alert("✅ Sent to Google Sheets")
    resetCart()

    .then(data => {
        alert("✅ Sent to Google Sheets");
    })
    .catch(err => {
        alert("❌ Failed");
        console.error(err);
    });

    resetCart();
}
function exportCSV() {
    let history = JSON.parse(localStorage.getItem("salesCSV")) || [];

    let header = [["Time","ID","Name","Price","Qty","Total"]];
    let rows = header.concat(history);

    let csv = rows.map(r => r.join(",")).join("\n");

    let blob = new Blob([csv], { type: "text/csv" });
    let a = document.createElement("a");

    a.href = URL.createObjectURL(blob);
    a.download = "sales_history.csv";
    a.click();
}

function resetCart() {
    products.forEach(p => {
        document.getElementById(p.id).value = "";
        document.getElementById("t" + p.id).innerText = 0;
    });

    document.getElementById("grandTotal").innerText = 0;
}
</script>
